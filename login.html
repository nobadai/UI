<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="원가 캣쳐 로그인">
  <title>로그인 | 원가 캣쳐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth-page" data-auth="login">
  <main class="auth-shell">
    <section class="auth-brand-panel">
      <a class="auth-brand" href="index.html#/dashboard" aria-label="원가 캣쳐 메인으로 이동">
        <svg viewBox="0 0 44 48" aria-hidden="true"><path d="M22 2 40 9v25L22 46 4 34V9Z" fill="currentColor"/><path d="m13 18 4-5 5 3 5-3 4 5v9c0 6-4 10-9 10s-9-4-9-10Z" fill="#fff"/><circle cx="18.5" cy="24" r="1.5" fill="currentColor"/><circle cx="25.5" cy="24" r="1.5" fill="currentColor"/><path d="M19 29q3 3 6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span><strong>원가 캣쳐</strong><small>COST CATCHER</small></span>
      </a>
      <div class="auth-brand-copy"><span>AI COST INTELLIGENCE</span><h1>가격 변동을<br>미리 보고 대비하세요.</h1><p>식자재 시장의 이상 신호부터 등록 메뉴의 예상 원가 영향까지 한 흐름으로 확인합니다.</p></div>
      <div class="auth-signal-list"><div><b>01</b><span>시장 이상 신호 포착</span></div><div><b>02</b><span>데이터 기반 근거 확인</span></div><div><b>03</b><span>메뉴·매장 원가 대응</span></div></div>
    </section>
    <section class="auth-form-panel">
      <div class="auth-card">
        <div class="auth-heading"><span>WELCOME BACK</span><h2>로그인</h2><p>원가 캣쳐 계정으로 서비스를 시작하세요.</p></div>
        <form id="authForm" novalidate>
          <label class="auth-field"><span>이메일</span><input type="email" id="email" placeholder="name@company.com" autocomplete="email" required></label>
          <label class="auth-field"><span>비밀번호</span><div class="password-field"><input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" minlength="8" required><button type="button" class="password-toggle" aria-label="비밀번호 표시"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label>
          <div class="auth-options"><label><input type="checkbox"> 로그인 상태 유지</label><a href="#" id="forgotPassword">비밀번호 찾기</a></div>
          <p class="auth-message" id="authMessage" aria-live="polite"></p>
          <button class="auth-submit" type="submit">로그인</button>
        </form>
        <div class="auth-divider"><span>간편 로그인</span></div>
        <div class="social-buttons single"><button type="button" data-social="Google"><span class="google-mark">G</span>Google 계정으로 계속하기</button></div>
        <p class="auth-switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
      </div>
      <p class="auth-footer">© 2026 Cost Catcher. UI Prototype</p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
