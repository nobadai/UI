<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="식자재 원가 조기경보 서비스 원가 캣쳐 HTML 프로토타입">
  <title>원가 캣쳐 | Cost Catcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" id="pageStyle" href="css/pages/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
      <div class="brand">
        <button class="brand-home" data-page="dashboard" aria-label="원가 캣쳐 메인으로 이동">
          <svg class="brand-mark" viewBox="0 0 44 48" aria-hidden="true"><path d="M22 2 40 9v25L22 46 4 34V9Z" fill="currentColor"/><path d="m13 18 4-5 5 3 5-3 4 5v9c0 6-4 10-9 10s-9-4-9-10Z" fill="#fff"/><circle cx="18.5" cy="24" r="1.5" fill="currentColor"/><circle cx="25.5" cy="24" r="1.5" fill="currentColor"/><path d="M19 29q3 3 6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span><strong>원가 캣쳐</strong><small>COST CATCHER</small></span>
        </button>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="메뉴 닫기">×</button>
      </div>
      <nav id="mainNav"></nav>
      <div class="sidebar-insight">
        <span class="eyebrow">AI EARLY SIGNAL</span>
        <strong>가격보다 먼저<br>변화의 근거를 봅니다.</strong>
        <p>오늘 2개 품목에서 새로운 위험 신호를 포착했습니다.</p>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="sidebarOpen" aria-label="메뉴 열기">☰</button>
        <div class="page-heading"><span id="breadcrumb">원가 캣쳐 / 대시보드</span><h1 id="pageTitle">대시보드</h1><p id="pageSubtitle">오늘의 식자재 동향과 원가 위험 신호를 확인하세요.</p></div>
        <div class="header-actions">
          <button class="icon-btn notification-button" id="notificationButton" aria-label="알림 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>3</span></button>
          <button class="help-button" id="helpButton"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 3.4 2.3c-1 .4-1 1.2-1 2.2M12 17h.01"/></svg><span>도움말</span></button>
          <div class="dropdown-wrap">
            <button class="select-button" id="companyButton">(주)캣쳐푸드 <span>⌄</span></button>
            <div class="dropdown" id="companyDropdown">
              <button data-company="(주)캣쳐푸드">(주)캣쳐푸드 <small>본사</small></button>
              <button data-company="캣쳐키친">캣쳐키친 <small>브랜드</small></button>
            </div>
          </div>
          <button class="profile" data-page="profile"><span class="avatar">원</span><span><strong>원가캣쳐 님</strong><small>관리자</small></span><b>⌄</b></button>
        </div>
      </header>

      <main id="appMain" tabindex="-1"></main>
    </div>
  </div>

  <button class="chat-launcher" id="chatLauncher"><span>AI</span> 원가 캣쳐 챗봇</button>
  <aside class="chat-panel" id="chatPanel" aria-label="원가 캣쳐 AI 챗봇" aria-hidden="true">
    <header><div><span class="chat-logo">AI</span><strong>원가 캣쳐 AI 챗봇</strong></div><button id="chatMinimize" aria-label="챗봇 닫기">×</button></header>
    <div class="chat-context"><span class="live-dot"></span><span id="chatContext">배추 시장 데이터를 기준으로 답변합니다</span></div>
    <div class="chat-hero"><div class="mascot-crop" role="img" aria-label="원가 캣쳐 고양이 마스코트"></div><div><strong>데이터를 보면, 위험이 보여요!</strong><span>가격 전망과 원가 영향을 물어보세요.</span></div></div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-form" id="chatForm"><input id="chatInput" placeholder="메시지를 입력하세요..." autocomplete="off" aria-label="챗봇 메시지"><button type="submit" aria-label="메시지 보내기">➤</button></form>
  </aside>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <script src="js/data/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
